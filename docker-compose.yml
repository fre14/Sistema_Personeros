# ===========================================================================
# Sistema Electoral - Entorno de DESARROLLO LOCAL y pruebas integradas
#
# Para producción en AWS (ECS Fargate + ALB + RDS + ElastiCache + S3):
# Consulte: docs/GUIA_DESPLIEGUE_AWS.md
#
# Arquitectura local: Nginx (balanceador) -> 4 backends Node -> PgBouncer ->
#                     PostgreSQL 16, con Redis para cache y WebSockets.
#
# Uso local:
#   cp backend/.env.example backend/.env
#   docker compose up -d
# ===========================================================================

x-backend-comun: &backend-comun
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: ./backend/.env
  volumes:
    - actas_data:/app/uploads
  depends_on:
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
    interval: 20s
    timeout: 5s
    retries: 3
    start_period: 30s
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 900M
  networks:
    - electoral-net

services:
  # ─────────────────────────────────────────────────────────
  # NGINX: balanceador + servidor del frontend + fotos de actas
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: electoral-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_comun.conf:/etc/nginx/proxy_comun.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - actas_data:/var/www/actas:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - backend-4
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────────────
  # BACKENDS: 4 instancias. Cada una atiende ~200 usuarios del pico.
  # ─────────────────────────────────────────────────────────
  backend-1:
    <<: *backend-comun
    container_name: electoral-backend-1
    environment:
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend-comun
    container_name: electoral-backend-2
    environment:
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend-comun
    container_name: electoral-backend-3
    environment:
      INSTANCE_ID: backend-3

  backend-4:
    <<: *backend-comun
    container_name: electoral-backend-4
    environment:
      INSTANCE_ID: backend-4

  # ─────────────────────────────────────────────────────────
  # PGBOUNCER: multiplexa las conexiones de los 4 backends.
  # Sin el, 4 x 40 = 160 conexiones reales golpean PostgreSQL.
  # Con el, PostgreSQL ve unas 25 y el resto se reutiliza.
  # ─────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: electoral-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-electoral_user}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      DB_NAME: ${DB_NAME:-sistema_electoral}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 60
      QUERY_WAIT_TIMEOUT: 20
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${DB_USER:-electoral_user}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────────────
  # POSTGRESQL 16
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: electoral-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sistema_electoral}
      POSTGRES_USER: ${DB_USER:-electoral_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: America/Lima
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups:/backups
    # El puerto NO se publica al exterior: solo se accede desde la red interna.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-electoral_user} -d ${DB_NAME:-sistema_electoral}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────────────
  # REDIS: cache del dashboard + pub/sub de Socket.io
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: electoral-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD en el archivo .env}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 1024
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────────────
  # RESPALDO AUTOMATICO de la base cada 30 minutos
  # ─────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: electoral-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER:-electoral_user}
      DB_NAME: ${DB_NAME:-sistema_electoral}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        archivo=/backups/respaldo-$$(date +%Y%m%d-%H%M).sql.gz;
        pg_dump -h postgres -U $$DB_USER $$DB_NAME | gzip > $$archivo &&
        echo \"[$$(date)] respaldo creado: $$archivo\";
        find /backups -name 'respaldo-*.sql.gz' -mmin +2880 -delete;
        sleep 1800;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - electoral-net

volumes:
  postgres_data:
  redis_data:
  actas_data:

networks:
  electoral-net:
    driver: bridge
