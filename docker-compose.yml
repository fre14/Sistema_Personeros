version: '3.8'

services:
  # ─────────────────────────────────────────────────
  # NGINX - Reverse Proxy & Load Balancer
  # ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: electoral-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────
  # BACKEND NODE 1 (Escalamiento Horizontal)
  # ─────────────────────────────────────────────────
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electoral-backend-1
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_ID: backend-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────
  # BACKEND NODE 2 (Escalamiento Horizontal)
  # ─────────────────────────────────────────────────
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electoral-backend-2
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_ID: backend-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────
  # POSTGRESQL 16 - Base de Datos Principal
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: electoral-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_electoral
      POSTGRES_USER: electoral_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-electoral_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electoral_user -d sistema_electoral"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electoral-net

  # ─────────────────────────────────────────────────
  # REDIS 7 - Cache + Socket.io Adapter (Pub/Sub)
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: electoral-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_electoral_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_electoral_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electoral-net

volumes:
  postgres_data:
  redis_data:

networks:
  electoral-net:
    driver: bridge
