worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────────────────────────────────────────
    # Logging
    # ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ──────────────────────────────────────────────
    # Performance
    # ──────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 12M;

    # ──────────────────────────────────────────────
    # Gzip Compression
    # ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    # ──────────────────────────────────────────────
    # Load Balancer: Backend Cluster
    # Algoritmo: least_conn (envía tráfico al nodo
    # con menos conexiones activas en ese momento)
    # ──────────────────────────────────────────────
    upstream backend_cluster {
        least_conn;
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
    }

    # ──────────────────────────────────────────────
    # Servidor Principal
    # ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Frontend: Archivos estáticos de React ──
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: cualquier ruta sin extensión
        # se resuelve a index.html para React Router
        location / {
            try_files $uri $uri/ /index.html;

            # Cache para assets con hash (JS, CSS, imágenes)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # ── API REST: Proxy al cluster de backend ──
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WebSockets: Socket.io en tiempo real ──
        location /socket.io/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Security Headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
