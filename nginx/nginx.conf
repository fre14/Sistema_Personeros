user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # 800 personeros + coordinadores mantienen un WebSocket abierto cada uno,
    # mas las peticiones normales. 8192 x workers deja margen de sobra.
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format principal '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         'upstream=$upstream_addr tiempo=$request_time';

    # Solo se registran errores: escribir cada acceso a disco durante el pico
    # compite con PostgreSQL por I/O.
    map $status $es_error {
        ~^[45]  1;
        default 0;
    }
    access_log /var/log/nginx/access.log principal if=$es_error;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  75s;
    keepalive_requests 1000;
    client_max_body_size 12M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    reset_timedout_connection on;

    types_hash_max_size 4096;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/xml+rss image/svg+xml;

    # IP real del visitante aunque este detras de Cloudflare
    map $http_cf_connecting_ip $ip_real {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    limit_req_zone $ip_real zone=zona_api:20m    rate=20r/s;
    limit_req_zone $ip_real zone=zona_login:10m  rate=1r/s;
    limit_req_zone $ip_real zone=zona_carga:10m  rate=2r/s;
    limit_conn_zone $ip_real zone=conexiones:20m;

    # ip_hash mantiene a cada usuario en el mismo backend mientras dure su
    # sesion. Sin esto, el handshake de Socket.io (que son varias peticiones)
    # se reparte entre nodos distintos y la conexion nunca se establece.
    upstream backend_cluster {
        ip_hash;
        server backend-1:3000 max_fails=3 fail_timeout=15s;
        server backend-2:3000 max_fails=3 fail_timeout=15s;
        server backend-3:3000 max_fails=3 fail_timeout=15s;
        server backend-4:3000 max_fails=3 fail_timeout=15s;
        keepalive 64;
        keepalive_timeout 60s;
    }

    map $http_upgrade $conexion_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

        limit_conn conexiones 50;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        # Fotos de actas guardadas en disco (STORAGE_DRIVER=local)
        location /actas/ {
            alias /var/www/actas/;
            expires 7d;
            add_header Cache-Control "private, max-age=604800";
            access_log off;
            try_files $uri =404;
        }

        location /api/auth/login {
            limit_req zone=zona_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_cluster;
            include /etc/nginx/proxy_comun.conf;
        }

        location /api/resultados {
            limit_req zone=zona_carga burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_cluster;
            proxy_request_buffering off;
            client_max_body_size 12M;
            include /etc/nginx/proxy_comun.conf;
        }

        location /api/ {
            limit_req zone=zona_api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://backend_cluster;
            include /etc/nginx/proxy_comun.conf;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location /socket.io/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conexion_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $ip_real;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
