# ==========================================================================
# PostgreSQL 16 - ajuste para VPS de 16 GB RAM / 6 vCPU
# Perfil: muchas lecturas concurrentes + escrituras en rafaga (4PM-8PM)
# ==========================================================================

listen_addresses = '*'
port = 5432

# ── Conexiones ──
# Con PgBouncer delante no hacen falta cientos de conexiones directas.
max_connections = 200
superuser_reserved_connections = 5

# ── Memoria ──
shared_buffers = 4GB                 # 25% de la RAM
effective_cache_size = 12GB          # estimacion de lo que cachea el sistema
maintenance_work_mem = 512MB
work_mem = 16MB                      # por operacion de orden/hash
huge_pages = try

# ── Escritura a disco (WAL) ──
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
# synchronous_commit=off da un gran salto de escritura a cambio de poder
# perder los ultimos ~200ms si el servidor se apaga de golpe. Para actas
# electorales preferimos la seguridad del dato: se deja en on.
synchronous_commit = on
wal_compression = on

# ── Disco NVMe ──
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# ── Paralelismo ──
max_worker_processes = 6
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ── Autovacuum agresivo: las tablas cambian sin parar durante la jornada ──
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms

# ── Registro ──
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000    # avisa de consultas de mas de 1 segundo
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%t [%p] %u@%d '

# ── Tiempos limite: evitan que una consulta colgada bloquee el sistema ──
statement_timeout = 30000            # 30 s
idle_in_transaction_session_timeout = 60000
lock_timeout = 10000

# ── Estadisticas ──
track_activities = on
track_counts = on
track_io_timing = on

timezone = 'America/Lima'
datestyle = 'iso, dmy'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.spanish'
